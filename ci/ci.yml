name: Synapto Framework CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cpp-tests:
    name: C++20 Reflex Engine & GoogleTest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: |
          cmake --build build -j$(nproc)

      - name: Run C++ Test Suite
        run: |
          ctest --test-dir build --output-on-failure --verbose

  python-tests:
    name: Python AI Core & PyTest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest
        run: |
          pytest -v tests/test_ai_core

      - name: Validate MuJoCo Headless Stepping
        run: |
          python src/twin/scripts/twin_viewer.py --headless --duration 2.0

  docker-build:
    name: Docker Multi-Container Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Services
        run: |
          docker compose build
