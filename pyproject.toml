[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapto-framework"
version = "1.0.0"
description = "Industrial Edge AI & Deterministic Real-Time Robotic Control Framework"
readme = "README.md"
authors = [{ name = "Daniyal Hasan" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "asyncua>=1.0.6",
    "numpy>=1.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "mujoco>=2.3.6"
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/test_ai_core"]
pythonpath = ["."]
